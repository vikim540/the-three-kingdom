<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>

  <!-- 腳下暗紅凶光環 (透明底) -->
  <ellipse cx="100" cy="245" rx="65" ry="18" fill="rgba(249,115,22,0.3)" stroke="#f97316" stroke-width="2" filter="url(#glow-orange)" />

  <!-- 嘍囉皮甲與粗暴裝束 -->
  <path d="M 60 130 L 40 225 L 100 238 L 160 225 L 140 130 Z" fill="url(#orange-grad)" stroke="#fdba74" stroke-width="1.5" />
  <path d="M 65 72 Q 100 60 135 72 L 148 135 L 52 135 Z" fill="#27272a" stroke="#ea580c" stroke-width="2" />

  <!-- 雙手黑鐵斧 -->
  <line x1="45" y1="40" x2="45" y2="210" stroke="#78350f" stroke-width="5" />
  <path d="M 45 50 Q 15 70 45 100 Z" fill="#71717a" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-orange)" />

  <!-- 山賊嘍囉面龐與頭巾 -->
  <circle cx="100" cy="52" r="22" fill="#3f3f46" stroke="#f97316" stroke-width="2" />
  <!-- 紅色山賊頭巾 -->
  <path d="M 78 45 Q 100 28 122 45 Q 100 38 78 45" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />
  <!-- 雙目發光 -->
  <circle cx="92" cy="53" r="3" fill="#fbbf24" />
  <circle cx="108" cy="53" r="3" fill="#fbbf24" />
</svg>
