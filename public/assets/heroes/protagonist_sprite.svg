<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="sword-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- 腳下修仙劍氣光環 (透明底) -->
  <ellipse cx="100" cy="250" rx="70" ry="20" fill="rgba(59,130,246,0.25)" stroke="#60a5fa" stroke-width="2.5" filter="url(#glow-blue)" />
  <ellipse cx="100" cy="250" rx="45" ry="12" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- 主角仙袍衣擺 (透明底) -->
  <path d="M 60 140 L 40 230 L 100 245 L 160 230 L 140 140 Z" fill="url(#blue-grad)" stroke="#93c5fd" stroke-width="2" />

  <!-- 御劍背姿與身軀 -->
  <path d="M 70 80 Q 100 65 130 80 L 145 150 L 55 150 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  
  <!-- 靈宵飛劍 (側身立姿) -->
  <path d="M 155 30 L 165 220 L 158 235 L 150 220 Z" fill="url(#sword-glow)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-blue)" />
  <circle cx="157" cy="220" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />

  <!-- 頭部髮髻與面龐 -->
  <circle cx="100" cy="55" r="24" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
  <path d="M 85 45 Q 100 25 115 45" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
  <!-- 束髮冠 -->
  <polygon points="94,32 106,32 103,20 97,20" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />

  <!-- 劍仙肩章與佩飾 -->
  <circle cx="72" cy="85" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="128" cy="85" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />

  <!-- 飄逸雲紋印記 -->
  <path d="M 80 170 Q 100 160 120 170 Q 100 180 80 170" fill="none" stroke="#fbbf24" stroke-width="2" />
</svg>
