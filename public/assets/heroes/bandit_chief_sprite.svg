<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="blade-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- 腳下凶煞鬼氣光環 (透明底) -->
  <ellipse cx="100" cy="250" rx="75" ry="22" fill="rgba(239,68,68,0.32)" stroke="#ef4444" stroke-width="2.5" filter="url(#glow-red)" />
  <ellipse cx="100" cy="250" rx="45" ry="12" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- 山賊首領魔袍與狂暴肌肉身軀 -->
  <path d="M 50 130 L 30 230 L 100 245 L 170 230 L 150 130 Z" fill="url(#red-grad)" stroke="#f87171" stroke-width="2" />
  <path d="M 60 70 Q 100 55 140 70 L 155 140 L 45 140 Z" fill="#18181b" stroke="#ef4444" stroke-width="2.5" />

  <!-- 鬼煞大刀 (扛刀悍勇姿勢) -->
  <path d="M 140 20 Q 175 100 160 210 L 140 215 Z" fill="url(#blade-glow)" stroke="#ffffff" stroke-width="2" filter="url(#glow-red)" />
  <!-- 刀柄骷髏 -->
  <circle cx="140" cy="215" r="8" fill="#fca5a5" stroke="#ef4444" stroke-width="2" />

  <!-- 獨眼寨主面龐與獨眼罩 -->
  <circle cx="100" cy="52" r="25" fill="#27272a" stroke="#ef4444" stroke-width="2.5" />
  <!-- 獨眼罩黑色皮帶 -->
  <line x1="77" y1="42" x2="123" y2="62" stroke="#000000" stroke-width="4" />
  <circle cx="92" cy="48" r="7" fill="#000000" stroke="#b91c1c" stroke-width="1.5" />
  <!-- 凶煞紅眼 -->
  <circle cx="110" cy="52" r="4" fill="#ef4444" filter="url(#glow-red)" />
  <!-- 疤痕 -->
  <line x1="106" y1="40" x2="114" y2="64" stroke="#dc2626" stroke-width="2" />

  <!-- 悍匪虎皮肩章 -->
  <path d="M 50 70 Q 65 50 80 75 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
  <path d="M 120 75 Q 135 50 150 70 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
</svg>
